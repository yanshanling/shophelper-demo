<style>
:root{
  --bg:#f0f2f5; --card:#fff; --side:#001529; --side-hover:#112a45;
  --primary:#1677ff; --primary-bg:#e6f4ff; --text:#1f1f1f; --muted:#8c8c8c;
  --border:#e8e8e8; --green:#52c41a; --green-bg:#f6ffed; --orange:#fa8c16;
  --orange-bg:#fff7e6; --red:#ff4d4f; --red-bg:#fff1f0; --gold:#faad14;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.app{display:flex;min-height:100vh}
/* ── 侧边栏 ── */
.sidebar{width:216px;background:var(--side);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:10}
.logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo b{font-size:17px;display:block}
.logo span{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.5px}
nav{flex:1;padding:12px 0}
nav a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:rgba(255,255,255,.65);cursor:pointer;font-size:14px;transition:.15s;border-left:3px solid transparent}
nav a:hover{color:#fff;background:var(--side-hover)}
nav a.active{color:#fff;background:var(--side-hover);border-left-color:var(--primary)}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-foot button{width:100%;padding:7px;background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.75);border-radius:6px;cursor:pointer;font-size:12px}
.sidebar-foot button:hover{border-color:#fff;color:#fff}
.sidebar-foot p{font-size:11px;color:rgba(255,255,255,.35);margin-top:10px}
/* ── 主区 ── */
main{flex:1;margin-left:216px;padding:0 24px 40px}
.topbar{display:flex;align-items:baseline;gap:12px;padding:20px 0 14px;border-bottom:1px solid var(--border);margin-bottom:20px;background:var(--bg)}
.topbar h1{font-size:20px;font-weight:600}
.topbar span{color:var(--muted);font-size:13px}
.page{display:none}
.page.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* ── 通用组件 ── */
.card{background:var(--card);border-radius:8px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.grid{display:grid;gap:16px}
.stat-grid{grid-template-columns:repeat(4,1fr)}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text)}
.stat .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat .lbl{color:var(--muted);font-size:12px;margin-top:4px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:top}
tr:hover td{background:#fafafa}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;line-height:18px;white-space:nowrap}
.tag.green{color:var(--green);background:var(--green-bg);border:1px solid #b7eb8f}
.tag.gray{color:#8c8c8c;background:#fafafa;border:1px solid #d9d9d9}
.tag.blue{color:var(--primary);background:var(--primary-bg);border:1px solid #91caff}
.tag.orange{color:var(--orange);background:var(--orange-bg);border:1px solid #ffd591}
.tag.red{color:var(--red);background:var(--red-bg);border:1px solid #ffa39e}
.tag.gold{color:#d48806;background:#fffbe6;border:1px solid #ffe58f}
.btn{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#4096ff}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.mini{padding:2px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.12)}
textarea{resize:vertical;line-height:1.6}
.form-row{margin-bottom:13px}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ── 模态框 ── */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto}
.modal{background:#fff;border-radius:10px;width:640px;max-width:100%;animation:fade .18s}
.modal.wide{width:820px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head b{font-size:15px}
.modal-close{cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.modal-close:hover{color:var(--red)}
.modal-body{padding:18px 20px;max-height:62vh;overflow:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--border);text-align:right;display:flex;gap:9px;justify-content:flex-end}
/* ── Toast ── */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-item{background:#fff;border-radius:8px;padding:9px 18px;box-shadow:0 4px 14px rgba(0,0,0,.16);font-size:13px;animation:fade .2s}
/* ── 知识库页 ── */
.kb-layout{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
.cat-item{padding:9px 12px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cat-item:hover{background:#f5f5f5}
.cat-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
.cat-item .cnt{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.toolbar input[type=text]{width:260px}
/* ── 条状图 ── */
.bar-row{display:grid;grid-template-columns:86px 1fr 44px;gap:10px;align-items:center;font-size:12px;margin-bottom:9px}
.bar-track{background:#f0f0f0;border-radius:5px;height:16px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:5px;transition:width .4s;min-width:2px}
.bar-row .v{text-align:right;color:var(--muted)}
/* ── 时间线 ── */
.tl{border-left:2px solid #e8e8e8;padding-left:16px}
.tl-item{position:relative;padding-bottom:15px}
.tl-item::before{content:'';position:absolute;left:-21px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.tl-item .t{font-size:12px;color:var(--muted)}
.tl-item .d{font-size:13px;margin-top:2px}
/* ── 模型卡片 ── */
.model-grid{grid-template-columns:repeat(3,1fr)}
.model-card .mc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.model-card .mc-head b{font-size:14px}
.mc-row{display:flex;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mc-row .k{min-width:60px}
.mc-row .v{color:var(--text)}
.mc-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.test-result{margin-top:10px;padding:8px 11px;border-radius:6px;font-size:12px;display:none}
/* ── 测试台 ── */
.pg-layout{display:grid;grid-template-columns:1fr 350px;gap:16px;align-items:start}
.chat-box{height:480px;overflow-y:auto;padding:16px;background:#fafafa;border-radius:8px;border:1px solid var(--border)}
.msg{max-width:82%;margin-bottom:13px}
.msg.user{margin-left:auto}
.msg .bubble{padding:10px 13px;border-radius:10px;white-space:pre-wrap;font-size:13px;line-height:1.65}
.msg.user .bubble{background:var(--primary);color:#fff;border-top-right-radius:2px}
.msg.bot .bubble{background:#fff;border:1px solid var(--border);border-top-left-radius:2px}
.msg .who{font-size:11px;color:var(--muted);margin-bottom:3px}
.chat-input{display:flex;gap:9px;margin-top:13px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{padding:3px 11px;border-radius:13px;background:#fff;border:1px solid var(--border);font-size:12px;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.trace-step{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed #f0f0f0;font-size:12px}
.trace-step:last-child{border-bottom:none}
.trace-step .ico{flex-shrink:0}
.trace-step .s{color:var(--muted);min-width:78px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:13px}
.meta-grid .k{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:34px 0;font-size:13px}
.hint-bar{background:var(--primary-bg);border:1px solid #91caff;color:#0958d9;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
@media (max-width:1080px){.pg-layout,.kb-layout{grid-template-columns:1fr}.stat-grid,.model-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function nowStr(){

  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function addLog(entityType, name, action){

   三、Agent 引擎（后端 agent_runtime.py 的 JS 移植）

const ORDER_PATTERNS = {
  zh:[/订单/,/我的订单/,/查.*单/,/状态/],
  en:[/order/,/my order/,/where is my/,/check.*order/,/status/,/order number/],
};
const SHIPPING_PATTERNS = {
  zh:[/物流/,/快递/,/到哪/,/多久到/,/什么时候到/,/跟踪/],
  en:[/tracking/,/track/,/where is.*package/,/delivery status/,/arrive/,/ship/,/how long/],
};
// 退款动作需显式动词（我要/我想/帮我/申请），避免「退货政策是什么」这类政策咨询被误判为退款请求
const REFUND_PATTERNS = [/refund/,/money back/,/cancel.*order/,/我要退款/,/我想退款/,/我要退货/,/我想退货/,/帮我退/,/申请退款/,/申请退货/,/取消订单/];
const COMPLAINT_KEYWORDS = ['angry','complaint','terrible','awful','disappointed','bad experience','投诉','生气','糟糕','失望','举报','差评'];
const CHITCHAT_PATTERNS = [/hi/,/hello/,/hey/,/thanks/,/thank/,/bye/,/good/,/你好/,/谢谢/,/再见/,/嗨/,/早上好/,/晚上好/];
const RED_KEYWORDS = ['删除账户','delete account','delete my data','sue','lawyer','legal action','投诉到','起诉','律师','法院'];
const ORANGE_KEYWORDS = ['refund','退款','compensation','赔偿','modify','修改地址'];
const INTENT_NAMES = {FAQ:'知识库查询',ORDER:'订单查询',SHIPPING:'物流追踪',REFUND:'退款请求',COMPLAINT:'投诉处理',CHITCHAT:'日常闲聊'};
const INTENT_COLORS = {FAQ:'blue',ORDER:'blue',SHIPPING:'blue',REFUND:'orange',COMPLAINT:'red',CHITCHAT:'gray'};
const ORDER_NO_RE = /[A-Z]{2}\d{4}-\d{4}/;
const TRACKING_NO_RE = /[A-Z]{2,3}\d{8,12}/;
const MOCK_ORDERS = {
  'US2024-3821':{customer:'Anna Müller',platform:'Shopify',status:'已发货',statusEn:'Shipped',items:"Women's Summer Dress (M, Blue) × 1",total:45.99,created:'2026-06-20',trackingNo:'SF7890123456',carrier:'SF-Intl'},
  'US2024-4521':{customer:'James Wilson',platform:'Amazon',status:'运输中',statusEn:'In Transit',items:'Bluetooth Earphones × 1',total:29.99,created:'2026-06-19',trackingNo:'DHL9876543210',carrier:'DHL'},
  'US2024-5100':{customer:'Sophie Martin',platform:'TikTok Shop',status:'已签收',statusEn:'Delivered',items:'Yoga Mat + Resistance Bands Set',total:35.50,created:'2026-06-15',trackingNo:'4PX1122334455',carrier:'4PX'},
};
// 意图打分权重：动作类意图（投诉/退款）优先级高于信息类（订单/物流/FAQ）
const W = {COMPLAINT:10,REFUND:8,ORDER:3,SHIPPING:3,FAQ:3,CHITCHAT:3};

function detectLanguage(text){
  const zh = (text.match(/[\u4e00-\u9fff]/g)||[]).length;
  return zh > text.length*0.3 ? 'zh' : 'en';
}
function splitKeywords(raw){
  if(!raw) return [];
  return raw.split(/[,，、;；\n]/).map(k=>k.trim().toLowerCase()).filter(Boolean);
}
function loadKb(){
  const cats = DB.categories;
  const catMap = {}; cats.forEach(c=>catMap[c.id]=c);
  const items = DB.items.filter(i=>i.status==='published' && catMap[i.categoryId]);
  return {catMap, items};
}
function matchKb(items, text, lang){
  const tl = text.toLowerCase();
  let best=null, bestScore=0;
  for(const item of items){
    let raw = lang==='en' ? item.keywordsEn : item.keywordsZh;
    let kws = splitKeywords(raw);
    if(!kws.length) kws = splitKeywords(lang==='en' ? item.keywordsZh : item.keywordsEn);
    const score = kws.filter(k=>tl.includes(k)).length;
    if(score>bestScore){bestScore=score;best=item;}
  }
  return [best,bestScore];
}
function recognizeIntent(text, lang, items){
  const tl = text.toLowerCase();
  const op = lang==='zh'?ORDER_PATTERNS.zh:ORDER_PATTERNS.en;
  const sp = lang==='zh'?SHIPPING_PATTERNS.zh:SHIPPING_PATTERNS.en;
  let complaintHits = COMPLAINT_KEYWORDS.filter(k=>tl.includes(k)).length;
  if(RED_KEYWORDS.some(k=>tl.includes(k))) complaintHits += 2; // 法律/删户类风险词计入投诉意图
  let refundHits = REFUND_PATTERNS.filter(p=>p.test(tl)).length;
  let orderHits = op.filter(p=>p.test(tl)).length;
  let shippingHits = sp.filter(p=>p.test(tl)).length;
  let chitchatHits = CHITCHAT_PATTERNS.filter(p=>p.test(tl)).length;
  const hasOrderNo = ORDER_NO_RE.test(text);
  const hasTrackingNo = TRACKING_NO_RE.test(text);
  if(hasOrderNo && orderHits) orderHits++;
  if(hasTrackingNo && shippingHits) shippingHits++;
  const [bestItem, faqHits] = matchKb(items, text, lang);
  const scores = {COMPLAINT:complaintHits*W.COMPLAINT,REFUND:refundHits*W.REFUND,ORDER:orderHits*W.ORDER,SHIPPING:shippingHits*W.SHIPPING,FAQ:faqHits*W.FAQ,CHITCHAT:chitchatHits*W.CHITCHAT};
  const maxScore = Math.max(...Object.values(scores));
  if(maxScore===0){
    if(hasOrderNo) return {intent:'ORDER',confidence:0.60,bestItem};
    if(hasTrackingNo) return {intent:'SHIPPING',confidence:0.60,bestItem};
    return {intent:'FAQ',confidence:0.15,bestItem};
  }
  let primary = Object.keys(scores).reduce((a,b)=>scores[b]>scores[a]?b:a);
  let confidence = Math.min(0.95, 0.40+0.08*scores[primary]);
  if(primary==='FAQ' && !bestItem) confidence = 0.30;
  return {intent:primary, confidence:Math.round(confidence*100)/100, bestItem};
}
function safetyCheck(intent, userInput, lang){
  const tl = userInput.toLowerCase();
  if(RED_KEYWORDS.some(k=>tl.includes(k))){
    return {level:'🔴 极高风险',action:'escalate',
      autoReply: lang==='zh'
        ?'我们非常重视您的反馈。为确保妥善处理，我将为您转接人工客服主管。请稍候...'
        :"We take your concerns very seriously. I'm escalating this to a human supervisor to ensure it's handled properly. Please hold..."};
  }
  if(ORANGE_KEYWORDS.some(k=>tl.includes(k)) && ['REFUND','COMPLAINT'].includes(intent)){
    return {level:'🟠 高风险',action:'pre_fill_and_escalate',
      autoReply: lang==='zh'
        ?'退款请求需要人工审核确认。我已经整理了您的信息，正在转接客服专员。预计等待不超过 2 分钟。'
        :"Refund requests require human verification. I've prepared your information and am connecting you to a specialist. Estimated wait: under 2 minutes."};
  }
  if(intent==='REFUND') return {level:'🟡 中风险',action:'auto_with_review',autoReply:null};
  return {level:'🟢 低风险',action:'auto',autoReply:null};
}
function renderPromptTemplate(scene, mapping){
  const tpl = DB.prompts.filter(p=>p.scene===scene && p.enabled)
    .sort((a,b)=>b.version-a.version)[0];
  if(!tpl || !tpl.content) return null;
  let c = tpl.content;
  for(const [k,v] of Object.entries(mapping)) c = c.split('{'+k+'}').join(String(v));
  return c;
}
function runAgent(userInput){
  const trace = [];
  const lang = detectLanguage(userInput);
  trace.push({icon:'🔍',step:'语言检测',detail: lang==='zh'?'检测为 中文':'检测为 English'});
  const {catMap, items} = loadKb();
  trace.push({icon:'🗂️',step:'加载配置',detail:`从配置库读取 ${DB.categories.length} 个分类 / ${items.length} 条知识库`});
  const {intent, confidence, bestItem} = recognizeIntent(userInput, lang, items);
  trace.push({icon:'🧠',step:'意图识别',detail:`${INTENT_NAMES[intent]} (置信度: ${Math.round(confidence*100)}%)`});
  const safety = safetyCheck(intent, userInput, lang);
  trace.push({icon:'🛡️',step:'安全护栏',detail:`风险等级: ${safety.level} → ${safety.action}`});
  let matchedItem = bestItem, reply='', source='rule_engine';
  if(safety.autoReply){
    reply = safety.autoReply;
  } else if(intent==='FAQ'){
    if(matchedItem){
      const cat = catMap[matchedItem.categoryId];
      const catName = cat ? cat.name : '知识库';
      const content = lang==='en'?matchedItem.answerEn:matchedItem.answerZh;
      const title = lang==='en'?matchedItem.titleEn:matchedItem.titleZh;
      trace.push({icon:'💭',step:'ReAct - 推理',detail:'判断为 FAQ 类问题 → 需检索知识库'});
      trace.push({icon:'🔧',step:'ReAct - 行动',detail:`🔧 命中知识库条目「${title}」(id=${matchedItem.id}, 分类=${catName})`});
      trace.push({icon:'👁️',step:'ReAct - 观察',detail:`返回内容 ${content.length} 字`});
      matchedItem.hitCount = (matchedItem.hitCount||0)+1; save();
      reply = lang==='zh'
        ? `📚 以下是关于「${catName}」的详细信息：\n\n${content}\n\n还有其他需要帮您的吗？`
        : `📚 Here's what I found about "${catName}":\n\n${content}\n\nIs there anything else I can help with?`;
      source = 'kb_item#'+matchedItem.id;
    } else {
      trace.push({icon:'👁️',step:'ReAct - 观察',detail:'未找到匹配知识库条目'});
      reply = lang==='zh'
        ? '抱歉，我暂时没有找到相关的信息。需要我帮您转接人工客服吗？'
        : "I couldn't find relevant information on this. Would you like me to connect you with a human agent?";
      source = 'no_kb_hit';
    }
  } else if(intent==='ORDER'){
    trace.push({icon:'💭',step:'ReAct - 推理',detail:'判断为订单查询 → 需调用 get_order_info'});
    const m = userInput.match(ORDER_NO_RE);
    if(m && MOCK_ORDERS[m[0]]){
      const o = MOCK_ORDERS[m[0]];
      const status = lang==='zh'?o.status:o.statusEn;
      trace.push({icon:'🔧',step:'ReAct - 行动',detail:`🔧 调用 get_order_info(${m[0]})`});
      trace.push({icon:'👁️',step:'ReAct - 观察',detail:`找到订单，状态: ${status}`});
      reply = lang==='zh'
        ? `📋 订单查询结果\n\n订单号：${m[0]}\n下单人：${o.customer}\n平台：${o.platform}\n商品：${o.items}\n金额：$${o.total}\n下单时间：${o.created}\n状态：${status}\n\n还有其他需要帮您的吗？`
        : `📋 Order Lookup Result\n\nOrder ID: ${m[0]}\nCustomer: ${o.customer}\nPlatform: ${o.platform}\nItems: ${o.items}\nTotal: $${o.total}\nOrder Date: ${o.created}\nStatus: ${status}\n\nAnything else I can help with?`;
      source = 'get_order_info';
    } else {
      trace.push({icon:'👁️',step:'ReAct - 观察',detail:'未检测到有效订单号 → 引导用户提供'});
      reply = lang==='zh'
        ? '请提供您的订单号（格式如 US2024-3821），我来帮您查询。\n\n💡 提示：订单号可以在确认邮件中找到。'
        : "Please provide your order number (format: US2024-3821) and I'll look it up for you.\n\n💡 Tip: You can find your order number in the confirmation email.";
      source = 'get_order_info_ask';
    }
  } else if(intent==='SHIPPING'){
    trace.push({icon:'💭',step:'ReAct - 推理',detail:'判断为物流追踪 → 需调用 track_package'});
    reply = lang==='zh'
      ? '请提供您的物流单号（tracking number），我来帮您查询包裹状态。\n\n💡 物流单号可以在发货确认邮件中找到。'
      : "Please provide your tracking number and I'll check your package status for you.\n\n💡 You can find the tracking number in your shipping confirmation email.";
    source = 'track_package_ask';
  } else if(intent==='REFUND'){
    trace.push({icon:'💭',step:'ReAct - 推理',detail:'退款/退换货请求 → 先查政策 + 验证订单'});
    const refundItem = DB.items.find(i=>(i.titleZh||'').includes('退') && (i.titleZh||'').includes('货') && i.status==='published');
    if(refundItem){
      trace.push({icon:'🔧',step:'ReAct - 行动',detail:`🔧 调用 search_faq → 命中「${refundItem.titleZh}」`});
      matchedItem = refundItem;
    }
    trace.push({icon:'🛡️',step:'安全护栏',detail:'🟠 高风险操作 → 自动回复 + 加入人工审核队列'});
    reply = lang==='zh'
      ? '📋 退款/退换货请求已受理。⚠️ 退款需要人工审核，我已为您提交请求，客服专员将在 24 小时内通过邮件与您联系。'
      : "📋 Refund/Return Request Submitted. ⚠️ Refunds require human review. I've submitted your request — a specialist will contact you via email within 24 hours.";
    source = 'refund_flow';
  } else if(intent==='COMPLAINT'){
    trace.push({icon:'💭',step:'ReAct - 推理',detail:'投诉/不满情绪 → 安抚 + 升级人工'});
    trace.push({icon:'🛡️',step:'安全护栏',detail:'🔴 自动升级到人工客服主管'});
    reply = lang==='zh'
      ? '非常抱歉给您带来了不好的体验！😔 我已经记录了您的反馈，并为您升级到客服主管处理。\n\n📌 预计 2 小时内会有专员通过邮件与您联系。'
      : "I'm truly sorry about your experience! 😔 I've logged your feedback and escalated this to a service supervisor.\n\n📌 A specialist will reach out via email within 2 hours.";
    source = 'complaint_flow';
  } else { // CHITCHAT
    trace.push({icon:'💭',step:'ReAct - 推理',detail:'闲聊类 → 无需工具调用，直接回复'});
    const tl = userInput.toLowerCase();
    if(lang==='zh'){
      if(['你好','嗨','早上好','晚上好','您好'].some(g=>tl.includes(g))) reply='您好！👋 我是 ShopHelper，您的跨境电商客服助手。有什么可以帮您的吗？';
      else if(['谢谢','感谢','多谢'].some(t=>tl.includes(t))) reply='不客气！很高兴能帮到您～ 还有其他问题随时问我哦 😊';
      else reply='您好！有什么可以帮助您的呢？例如：查订单、查物流、了解退换政策、尺码建议等。';
    } else {
      if(['hi','hello','hey','good morning','good evening'].some(g=>tl.includes(g))) reply="Hello! 👋 I'm ShopHelper, your cross-border e-commerce assistant. How can I help you today?";
      else if(['thanks','thank','appreciate'].some(t=>tl.includes(t))) reply="You're welcome! Glad I could help 😊 Feel free to reach out anytime!";
      else reply='Hello! How can I assist you? For example: check order status, track a package, learn about return policies, or get size recommendations.';
    }
    source = 'chitchat';
  }
  const systemPrompt = renderPromptTemplate('system',{language:lang==='zh'?'中文':'English',intent:INTENT_NAMES[intent]});
  if(systemPrompt) trace.push({icon:'📝',step:'Prompt 装配',detail:`已应用「system」场景 Prompt 模板（${systemPrompt.length} 字）`});
  DB.chats.push({input:userInput,language:lang,intent,confidence,safety:safety.level,reply,time:nowStr()});
  DB.chats = DB.chats.slice(-100); save();
  return {reply,language:lang,intent,intentName:INTENT_NAMES[intent],confidence,safety,
          matchedItemId:matchedItem?matchedItem.id:null,source,trace};
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast-item';

  el.innerHTML = `<span style="color:${color}">●</span> ${esc(msg)}`;
  $('#toast').appendChild(el);

}

      const q = $('#st_q').value.trim();
      if(!q){toast('请输入测试问题','warn');return false;}
      const lang = detectLanguage(q);
      const {items} = loadKb();
      const [best,score] = matchKb(items,q,lang);
      const {intent,confidence} = recognizeIntent(q,lang,items);
      const kws = best ? splitKeywords(lang==='en'?best.keywordsEn:best.keywordsZh).filter(k=>q.toLowerCase().includes(k)) : [];
      $('#st_result').innerHTML = `

        <div style="background:#fafafa;border-radius:6px;padding:11px;font-size:13px;white-space:pre-wrap;max-height:200px;overflow:auto">${esc(lang==='en'?best.answerEn:best.answerZh)}</div>`
        :'<p class="empty">❌ 未命中任何已发布条目 —— Agent 将引导转人工或补充新条目</p>'}
      </div>`;
      return false; // 保持弹窗打开，便于反复测试
    }});
}

function renderPrompts(){

        <div style="white-space:nowrap">

          <button class="btn mini" onclick="previewPrompt(${p.id})">渲染预览</button>

      </div>
    </div>`).join('')}

function editPrompt(id){
  const p = DB.prompts.find(x=>x.id===id);
  openModal({title:'编辑 Prompt（保存将生成新版本）', okText:'保存新版本', wide:true,
    body:`
    <div class="form-row"><label>备注（本次修改说明）</label><input type="text" id="p_note" placeholder="例如：调整退款话术语气"></div>
    <div class="form-row"><label>内容 ${p.variables?`（变量：${esc(p.variables)}）`:''}</label>
      <textarea id="p_content" rows="14" style="font-family:Consolas,monospace">${esc(p.content)}</textarea></div>`,
    onOk(){
      const content = $('#p_content').value;
      if(!content.trim()){toast('内容不能为空','error');return false;}
      if(content===p.content){toast('内容未变化，未生成新版本','warn');return;}
      p.version += 1;
      p.content = content;
      p.versions.push({version:p.version,note:$('#p_note').value.trim()||'无备注',operator:'运营-我',time:nowStr()});
      addLog('prompt',p.name,'update');
      save(); renderPrompts(); toast(`已保存为 v${p.version} 并即时生效`);
    }});
}
function promptVersions(id){
  const p = DB.prompts.find(x=>x.id===id);
  const vs = [...p.versions].reverse();
  openModal({title:`版本历史 · ${p.name}`, okText:'关闭', hideOkClose:true, wide:true,
    body: vs.map((v,i)=>`
    <div style="border:1px solid var(--border);border-radius:8px;padding:13px;margin-bottom:11px;${v.version===p.version?'border-color:var(--primary);background:var(--primary-bg)':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <b>v${v.version} ${v.version===p.version?'<span class="tag blue">当前生效</span>':''}</b>
        ${v.version!==p.version?`<button class="btn mini" onclick="rollbackPrompt(${p.id},${v.version})">回滚到此版本</button>`:''}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:7px">${esc(v.time)} · ${esc(v.operator)} · ${esc(v.note)}</div>
      <div style="background:#fafafa;border-radius:6px;padding:10px;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;max-height:130px;overflow:auto">${esc(v.content)}</div>
    </div>`).join(''),
    onOk(){}});
}
function rollbackPrompt(id, version){
  const p = DB.prompts.find(x=>x.id===id);
  const v = p.versions.find(x=>x.version===version);
  p.version += 1;
  p.content = v.content;
  p.versions.push({version:p.version,note:`回滚至 v${version}`,operator:'运营-我',time:nowStr()});
  addLog('prompt',p.name,'update');
  save(); closeModal(); renderPrompts(); toast(`已回滚到 v${version} 的内容（现为 v${p.version}）`);
}
function togglePrompt(id){
  const p = DB.prompts.find(x=>x.id===id);
  p.enabled = !p.enabled;
  addLog('prompt',p.name,'update');
  save(); renderPrompts(); toast(p.enabled?'已启用，即时生效':'已停用');
}
function previewPrompt(id){
  const p = DB.prompts.find(x=>x.id===id);
  const vars = p.variables ? p.variables.split(',').map(v=>v.trim()).filter(Boolean) : [];
  if(!vars.length){
    openModal({title:'渲染预览（无变量）',okText:'关闭',hideOk:true,
      body:`<div style="background:#fafafa;border-radius:6px;padding:13px;white-space:pre-wrap;font-size:13px">${esc(p.content)}</div>`,onOk(){}});
    return;
  }
  openModal({title:'渲染预览', okText:'渲染',
    body: vars.map(v=>`<div class="form-row"><label>变量 {${esc(v)}}</label><input type="text" id="pv_${esc(v)}" value="${v==='language'?'中文':v==='intent'?'退款请求':v==='category'?'物流运费':v==='kb_content'?'（知识库内容…）':v==='order_id'?'US2024-4521':''}"></div>`).join('')
      + `<div id="pv_result"></div>`,
    onOk(){
      let out = p.content;
      vars.forEach(v=>{ out = out.split('{'+v+'}').join($('#pv_'+v).value); });
      $('#pv_result').innerHTML = `<div style="background:#fafafa;border-radius:6px;padding:13px;white-space:pre-wrap;font-size:13px;margin-top:8px">${esc(out)}</div>`;
      return false;
    }});
}

/* ══════════════════════════════════════════════════════════════
   八、页面：大模型接入
   ══════════════════════════════════════════════════════════════ */
const ROUTE_NAMES = {en:'英文线路',zh:'中文线路',all:'兜底线路'};
function renderModels(){
  $('#page-models').innerHTML = `
  <div class="hint-bar">💡 所有线路统一走 <b>OpenAI 兼容协议</b>，换模型 = 改配置，不动代码。演示版不真实调用 API，仅管理配置。</div>
  <div class="grid model-grid">
  ${DB.models.map(m=>`
    <div class="card model-card">
      <div class="mc-head">
        <b>${esc(m.name)}</b>
        ${m.isDefault?'<span class="tag blue">默认线路</span>':''}
      </div>
      <div class="mc-row"><span class="k">供应商</span><span class="v">${esc(m.provider)} · ${esc(m.modelName)}</span></div>
      <div class="mc-row"><span class="k">Endpoint</span><span class="v" style="word-break:break-all">${esc(m.baseUrl)}</span></div>
      <div class="mc-row"><span class="k">API Key</span><span class="v">${esc(m.apiKey)}</span></div>
      <div class="mc-row"><span class="k">参数</span><span class="v">
        <span class="tag gray">temp ${m.temperature}</span>
        <span class="tag gray">max_tokens ${m.maxTokens}</span>
        <span class="tag gray">top_p ${m.topP}</span></span></div>
      <div class="mc-row"><span class="k">路由</span><span class="v"><span class="tag ${m.routeLang==='en'?'blue':m.routeLang==='zh'?'green':'gold'}">${ROUTE_NAMES[m.routeLang]}</span></span></div>
      <div class="mc-row"><span class="k">备注</span><span class="v">${esc(m.remark)}</span></div>
      <div class="mc-actions">
        <button class="btn mini" onclick="editModel(${m.id})">编辑</button>
        ${m.isDefault?'':`<button class="btn mini" onclick="setDefaultModel(${m.id})">设为默认</button>`}
        <button class="btn mini" onclick="testModel(${m.id},this)">⚡ 连通性测试</button>
      </div>
      <div class="test-result" id="tr_${m.id}"></div>
    </div>`).join('')}
    <div class="card" style="display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);cursor:pointer;min-height:220px;color:var(--muted)" onclick="editModel()">
      ＋ 新增模型线路</div>
  </div>`;
}
function editModel(id){
  const m = id ? DB.models.find(x=>x.id===id) : null;
  openModal({title: m?'编辑模型线路':'新增模型线路', okText:'保存',
    body:`
    <div class="form-row"><label>线路名称</label><input type="text" id="m_name" value="${esc(m?m.name:'')}"></div>
    <div class="form-2col">
      <div class="form-row"><label>供应商</label><input type="text" id="m_prov" value="${esc(m?m.provider:'')}"></div>
      <div class="form-row"><label>模型 ID</label><input type="text" id="m_model" value="${esc(m?m.modelName:'')}"></div>
    </div>
    <div class="form-row"><label>Base URL（OpenAI 兼容）</label><input type="text" id="m_url" value="${esc(m?m.baseUrl:'')}"></div>
    <div class="form-row"><label>API Key</label><input type="password" id="m_key" value="${esc(m?m.apiKey:'')}"></div>
    <div class="form-2col">
      <div class="form-row"><label>temperature</label><input type="number" id="m_temp" step="0.1" min="0" max="2" value="${m?m.temperature:0.3}"></div>
      <div class="form-row"><label>max_tokens</label><input type="number" id="m_mt" value="${m?m.maxTokens:1024}"></div>
    </div>
    <div class="form-2col">
      <div class="form-row"><label>top_p</label><input type="number" id="m_tp" step="0.1" min="0" max="1" value="${m?m.topP:1}"></div>
      <div class="form-row"><label>路由语言</label>
        <select id="m_route">
          <option value="en" ${m&&m.routeLang==='en'?'selected':''}>英文线路（en）</option>
          <option value="zh" ${m&&m.routeLang==='zh'?'selected':''}>中文线路（zh）</option>
          <option value="all" ${m&&m.routeLang==='all'?'selected':''}>兜底线路（all）</option>
        </select></div>
    </div>
    <div class="form-row"><label>备注</label><input type="text" id="m_remark" value="${esc(m?m.remark:'')}"></div>`,
    onOk(){
      const name = $('#m_name').value.trim();
      if(!name){toast('线路名称不能为空','error');return false;}
      const data = {
        name, provider:$('#m_prov').value.trim(), modelName:$('#m_model').value.trim(),
        baseUrl:$('#m_url').value.trim(), apiKey:$('#m_key').value,
        temperature:+$('#m_temp').value, maxTokens:+$('#m_mt').value|0, topP:+$('#m_tp').value,
        routeLang:$('#m_route').value, remark:$('#m_remark').value,
      };
      if(m){ Object.assign(m,data); addLog('model',m.name,'update'); toast('模型配置已保存'); }
      else{
        const nid = Math.max(0,...DB.models.map(x=>x.id))+1;
        DB.models.push({id:nid,isDefault:false,...data});
        addLog('model',name,'create'); toast('新增模型线路成功');
      }
      save(); renderModels(); renderDashboard();
    }});
}
function setDefaultModel(id){
  DB.models.forEach(m=>m.isDefault = m.id===id);
  const m = DB.models.find(x=>x.id===id);
  addLog('model',m.name,'update');
  save(); renderModels(); renderDashboard(); toast(`已将「${m.name}」设为默认线路`);
}
function testModel(id, btn){
  const m = DB.models.find(x=>x.id===id);
  const box = $('#tr_'+id);
  btn.disabled = true; btn.textContent = '测试中…';
  box.style.display='block';
  box.style.background='var(--primary-bg)';
  box.textContent = `⏳ 正在连接 ${m.baseUrl} …`;
  setTimeout(()=>{
    const latency = 180 + Math.floor(Math.random()*280);
    box.style.background='var(--green-bg)';
    box.innerHTML = `✅ 连通正常 · ${esc(m.modelName)} 响应 OK · 延迟 ${latency}ms<br><span style="color:var(--muted)">（演示版为模拟结果；生产版此处真实调用 /chat/completions）</span>`;
    btn.disabled=false; btn.textContent='⚡ 连通性测试';
  }, 900);
}

/* ══════════════════════════════════════════════════════════════
   九、页面：Agent 测试台
   ══════════════════════════════════════════════════════════════ */
const SCENARIOS = [
  {label:'🇺🇸 订单查询',text:"What's the status of my order US2024-3821?"},
  {label:'🇺🇸 退货政策',text:"What's your return policy? Can I return if I don't like the color?"},
  {label:'🇺🇸 尺码咨询',text:"I'm not sure about sizing. What size should I get if I usually wear M?"},
  {label:'🇺🇸 物流追踪',text:'Where is my package with tracking number DHL9876543210?'},
  {label:'🇨🇳 物流运费',text:'寄到美国运费多少钱？'},
  {label:'🇨🇳 加急配送',text:'你们的加急配送怎么收费？多久能到？'},
  {label:'🇨🇳 退货请求',text:'我想退货，尺码不合适'},
  {label:'🇨🇳 投诉场景',text:'你们的东西太糟糕了，我要投诉！'},
  {label:'🔴 法律风险',text:'I want to sue you, this is unacceptable!'},
];
let chatMsgs = [];
let lastResult = null;
function renderPlayground(){
  $('#page-playground').innerHTML = `
  <div class="pg-layout">
    <div class="card">
      <div class="chat-box" id="chatBox">
        ${chatMsgs.length ? chatMsgs.map(m=>msgHtml(m)).join('')
          : '<div class="empty">与 Agent 开始对话 —— 每轮回复展示 ReAct 推理链 Trace 与配置溯源</div>'}
      </div>
      <div class="chips">${SCENARIOS.map((s,i)=>`<span class="chip" onclick="fillScenario(${i})">${esc(s.label)}</span>`).join('')}</div>
      <div class="chat-input">
        <input type="text" id="pgInput" placeholder="输入用户消息，回车发送…" onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn primary" onclick="sendMsg()">发送 ➤</button>
      </div>
    </div>
    <div class="card">
      <h3>🔎 运行分析（Trace 回放）</h3>
      <div id="analysis"><div class="empty">发送消息后展示<br>意图 / 置信度 / 安全等级 / 命中配置 / ReAct 步骤</div></div>
    </div>
  </div>`;
  const box = $('#chatBox'); if(box) box.scrollTop = box.scrollHeight;
}
function msgHtml(m){
  if(m.role==='user') return `<div class="msg user"><div class="who">🧑 顾客</div><div class="bubble">${esc(m.text)}</div></div>`;
  return `<div class="msg bot"><div class="who">🤖 ShopHelper</div><div class="bubble">${esc(m.text)}</div></div>`;
}
function fillScenario(i){ $('#pgInput').value = SCENARIOS[i].text; $('#pgInput').focus(); }
function sendMsg(){
  const input = $('#pgInput');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  chatMsgs.push({role:'user',text});
  const r = runAgent(text);
  chatMsgs.push({role:'bot',text:r.reply});
  lastResult = r;
  renderPlayground();
  renderAnalysis();
  renderDashboard();
}
function renderAnalysis(){
  const r = lastResult;
  if(!r){ return; }
  const matched = r.matchedItemId ? DB.items.find(i=>i.id===r.matchedItemId) : null;
  const safetyColor = r.safety.level.includes('极高')?'red':r.safety.level.includes('高')?'orange':r.safety.level.includes('中')?'gold':'green';
  $('#analysis').innerHTML = `
  <div class="meta-grid">
    <div><span class="k">意图</span><br><span class="tag ${INTENT_COLORS[r.intent]}">${esc(r.intentName)}</span></div>
    <div><span class="k">置信度</span><br><b>${Math.round(r.confidence*100)}%</b></div>
    <div><span class="k">语言</span><br><b>${r.language==='zh'?'中文 🇨🇳':'English 🇺🇸'}</b></div>
    <div><span class="k">安全等级</span><br><span class="tag ${safetyColor}">${esc(r.safety.level)}</span></div>
    <div><span class="k">护栏动作</span><br><b>${esc(r.safety.action)}</b></div>
    <div><span class="k">回复来源</span><br><b style="font-size:12px">${esc(r.source)}</b></div>
  </div>
  ${matched?`<div style="border:1px solid #b7eb8f;background:var(--green-bg);border-radius:8px;padding:10px 12px;margin-bottom:13px;font-size:12px">
    ✅ 命中知识库 <b>#${matched.id} ${esc(matched.titleZh)}</b><br>
    <span style="color:var(--muted)">—— 该条目由运营在「知识库管理」维护，修改后即时生效</span></div>`:''}
  <div style="font-size:12px;color:var(--muted);margin-bottom:7px">ReAct 推理链（${r.trace.length} 步）：</div>
  ${r.trace.map(t=>`<div class="trace-step"><span class="ico">${t.icon}</span><span class="s">${esc(t.step)}</span><span>${esc(t.detail)}</span></div>`).join('')}`;
}

/* ══════════════════════════════════════════════════════════════
   十、路由与初始化
   ══════════════════════════════════════════════════════════════ */
const PAGES = {
  dashboard:['概览仪表盘','配置资产总览 · 意图分布 · 命中热点 · 变更审计'],
  knowledge:['知识库管理','中英双语条目增删改查 · 状态管理 · 检索测试（配置驱动）'],
  prompts:['Prompt 管理','人设与场景话术 · 版本快照 · 回滚 · 渲染预览'],
  models:['大模型接入','OpenAI 兼容 · 多线路路由 · 参数与连通性管理'],
  playground:['Agent 测试台','实时对话 · ReAct Trace 回放 · 配置溯源'],
};
const RENDER = {dashboard:renderDashboard,knowledge:renderKnowledge,prompts:renderPrompts,models:renderModels,playground:renderPlayground};
function go(page){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+page));
  $('#pageTitle').textContent = PAGES[page][0];
  $('#pageDesc').textContent = PAGES[page][1];
  RENDER[page]();
}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.page));
$('#resetBtn').onclick = ()=>{
  openModal({title:'重置演示数据',okText:'确认重置',
    body:'<p>将清空你在本浏览器中的所有修改（知识库 / Prompt / 模型 / 会话），恢复到初始演示数据。</p>',
    onOk(){ localStorage.removeItem(LS_KEY); DB = SEED(); save(); chatMsgs=[]; lastResult=null; go('dashboard'); toast('演示数据已重置'); }});
};
go('dashboard');
</script>
</body>
</html>
